<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0000003a"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#g)"/>
  <!-- Subtle inner highlight -->
  <rect width="512" height="240" rx="128" fill="white" fill-opacity="0.06"/>
  <!-- 5 petals, 72° apart, centred at 256,256 -->
  <g transform="translate(256 256)" fill="white" fill-opacity="0.90" filter="url(#s)">
    <ellipse cx="0" cy="-115" rx="52" ry="84"/>
    <ellipse cx="0" cy="-115" rx="52" ry="84" transform="rotate(72)"/>
    <ellipse cx="0" cy="-115" rx="52" ry="84" transform="rotate(144)"/>
    <ellipse cx="0" cy="-115" rx="52" ry="84" transform="rotate(216)"/>
    <ellipse cx="0" cy="-115" rx="52" ry="84" transform="rotate(288)"/>
  </g>
  <!-- Centre bloom -->
  <circle cx="256" cy="256" r="60" fill="white"/>
</svg>
